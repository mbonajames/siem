<header class="app-header">

  <!-- ── Left: menu toggle + page title ──────────────────────────────────── -->
  <div class="header-left">
    <button mat-icon-button class="menu-btn" (click)="menuToggle.emit()"
            matTooltip="Toggle navigation" matTooltipShowDelay="600">
      <mat-icon>menu</mat-icon>
    </button>

    <div class="page-meta">
      <mat-icon class="page-icon">{{ currentPageIcon }}</mat-icon>
      <span class="page-title">{{ currentPageTitle }}</span>
    </div>
  </div>

  <!-- ── Right: actions + user ───────────────────────────────────────────── -->
  <div class="header-right">

    <!-- Notifications -->
    <button mat-icon-button class="header-icon-btn"
            [matTooltip]="notificationCount
              ? notificationCount + ' critical/high alerts (last 24h)'
              : 'No critical alerts'"
            [matBadge]="notificationCount || null"
            [matBadgeHidden]="notificationCount === 0"
            matBadgeColor="warn"
            matBadgeSize="small"
            (click)="goToNotifications()">
      <mat-icon [class.text-severity-high]="notificationCount > 0">
        {{ notificationCount > 0 ? 'notifications_active' : 'notifications' }}
      </mat-icon>
    </button>

    <!-- User menu -->
    <button mat-icon-button [matMenuTriggerFor]="userMenu"
            class="user-avatar-btn" matTooltip="Account" matTooltipShowDelay="600">
      <div class="user-avatar">{{ initials }}</div>
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before" class="user-menu">
      <div class="user-menu-header" mat-menu-item disabled>
        <div class="user-avatar-lg">{{ initials }}</div>
        <div class="user-menu-info">
          <div class="user-menu-name">{{ displayName }}</div>
          <div class="user-menu-email">{{ email }}</div>
          @if (roleBadge) {
            <span class="role-badge" [class.admin]="isAdmin">{{ roleBadge }}</span>
          }
        </div>
      </div>
      <mat-divider />
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sign out</span>
      </button>
    </mat-menu>

  </div>
</header>
