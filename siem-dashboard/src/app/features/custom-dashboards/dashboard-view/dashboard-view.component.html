<div class="view-shell">

  <!-- Toolbar -->
  <div class="view-toolbar">
    <button class="back-btn" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>

    <span class="dash-title">{{ dashTitle }}</span>

    <span class="spacer"></span>

    <!-- Time range (hidden in edit mode — Grafana has its own time picker) -->
    @if (!editMode) {
      <div class="time-group">
        @for (tr of timeRanges; track tr.from) {
          <button class="time-btn" [class.active]="selectedFrom === tr.from"
            (click)="changeTime(tr.from)">{{ tr.label }}</button>
        }
      </div>
    }

    <!-- View / Edit toggle -->
    <div class="mode-group">
      <button class="mode-btn" [class.active]="!editMode" (click)="editMode && toggleEditMode()"
        matTooltip="View mode — kiosk">
        <mat-icon>visibility</mat-icon> View
      </button>
      <button class="mode-btn" [class.active]="editMode" (click)="!editMode && toggleEditMode()"
        matTooltip="Edit mode — Grafana toolbar">
        <mat-icon>edit</mat-icon> Edit
      </button>
    </div>

    <button mat-icon-button matTooltip="Open in Grafana (new tab)" (click)="openInGrafana()">
      <mat-icon>open_in_new</mat-icon>
    </button>

    <button mat-icon-button matTooltip="Delete dashboard" color="warn"
      (click)="delete()" [disabled]="deleting">
      @if (deleting) { <mat-icon class="spin-icon">sync</mat-icon> }
      @else { <mat-icon>delete_outline</mat-icon> }
    </button>
  </div>

  <!-- Content -->
  <div class="view-content">
    @if (loading) {
      <div class="centered"><mat-spinner diameter="36"></mat-spinner></div>
    } @else if (!config?.configured) {
      <div class="centered">
        <mat-icon>bar_chart</mat-icon>
        <p>Grafana is not configured. Set GRAFANA_URL and GRAFANA_API_KEY in .env.</p>
      </div>
    } @else if (iframeSrc) {
      <iframe class="gf-iframe" [src]="iframeSrc" frameborder="0" allowfullscreen></iframe>
    }
  </div>

</div>
