<div class="login-page">

  <!-- Background grid decoration -->
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow-orange" aria-hidden="true"></div>
  <div class="bg-glow-purple" aria-hidden="true"></div>

  <!-- Card -->
  <div class="login-card">

    <!-- Top gradient accent bar -->
    <div class="card-accent" aria-hidden="true"></div>

    <!-- Logo + identity -->
    <div class="logo-area">
      <img class="hope-logo"
           src="https://www.hopeinternational.org/assets/images/brand/HOPE_H_yellowgray_web.svg"
           alt="Hope International" />
      <h1 class="org-title">Hope International</h1>
      <p class="org-subtitle">Security Operations Center</p>
    </div>

    <!-- Divider -->
    <div class="card-divider"></div>

    <!-- Sign-in -->
    <button mat-flat-button class="sign-in-btn" (click)="signIn()">
      <svg class="ms-logo" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="10" height="10" fill="#f25022"/>
        <rect x="11" width="10" height="10" fill="#7fba00"/>
        <rect y="11" width="10" height="10" fill="#00a4ef"/>
        <rect x="11" y="11" width="10" height="10" fill="#ffb900"/>
      </svg>
      Sign in with Microsoft
    </button>

    <!-- Footer note -->
    <p class="footer-note">
      Use your <strong>Hope International</strong> Microsoft 365 account.<br>
      Unauthorized access is prohibited and monitored.
    </p>

  </div>

  <!-- Bottom wordmark -->
  <p class="page-wordmark">Hope·Armor SIEM · Powered by Darktrace, Sophos &amp; Defender</p>

</div>
